<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skript pad</title>
<style>
  /* ---- tokens: slate ramp (bqnpad-inspired), dark default ---- */
  :root {
    --bg: hsl(200, 7%, 8.8%);
    --bg-subtle: hsl(195, 7.1%, 11%);
    --bg-ui: hsl(197, 6.8%, 13.6%);
    --bg-ui-hover: hsl(198, 6.6%, 15.8%);
    --bg-active: hsl(199, 6.4%, 17.9%);
    --border: hsl(201, 6.2%, 20.5%);
    --border-strong: hsl(203, 6%, 24.3%);
    --text: hsl(210, 6%, 93%);
    --text-dim: hsl(206, 6%, 63%);
    --accent: hsl(209, 100%, 60.6%);
    --accent-strong: hsl(209, 100%, 66.1%);
    --on-accent: hsl(210, 40%, 8%);
    --error: #dc3c43;
    --error-bg: hsl(0, 55%, 14%);
    --num: hsl(150, 45%, 58%);
    --str: hsl(39, 100%, 57%);
    --kw: hsl(210, 100%, 66.1%);
    --typ: hsl(206, 100%, 62%);
    --syn: hsl(212, 40%, 72%);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --paren0: #e06c75;
    --paren1: #d19a66;
    --paren2: #e5c07b;
    --paren3: #98c379;
    --paren4: #61afef;
    --paren5: #c678dd;
    --radius: 8px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  [data-theme="light"] {
    --bg: hsl(206, 30%, 98.8%);
    --bg-subtle: hsl(210, 16.7%, 97.6%);
    --bg-ui: hsl(209, 13.3%, 95.3%);
    --bg-ui-hover: hsl(209, 12.2%, 93.2%);
    --bg-active: hsl(208, 11.7%, 91.1%);
    --border: hsl(208, 11.3%, 88.9%);
    --border-strong: hsl(207, 11.1%, 85.9%);
    --text: hsl(206, 24%, 9%);
    --text-dim: hsl(206, 6%, 43.5%);
    --accent: hsl(206, 100%, 50%);
    --accent-strong: hsl(211, 100%, 43.2%);
    --on-accent: #fff;
    --error: #b4231f;
    --error-bg: hsl(0, 65%, 95%);
    --num: hsl(152, 65%, 26%);
    --str: hsl(30, 100%, 30%);
    --kw: hsl(211, 100%, 43.2%);
    --typ: hsl(206, 100%, 38%);
    --syn: hsl(212, 45%, 40%);
    --paren0: #c0362c;
    --paren1: #b26a00;
    --paren2: #8a6d00;
    --paren3: #2e7d32;
    --paren4: #1565c0;
    --paren5: #6a1b9a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

  /* ---- header ---- */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    padding: 0.6rem 1rem;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .app-header__left { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
  .app-header h1 {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.01em;
    margin: 0;
    white-space: nowrap;
  }
  .app-header .wordmark { color: var(--accent-strong); }
  .app-header__sub { color: var(--text-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-header__right { display: flex; align-items: center; gap: 0.5rem; flex: none; }

  .status {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    background: var(--bg-ui);
  }
  .status.ok { color: var(--num); border-color: color-mix(in srgb, var(--num) 35%, var(--border)); }
  .status.err { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, var(--border)); background: var(--error-bg); }

  .btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 550;
    color: var(--text);
    background: var(--bg-ui);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
    transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .btn:hover { background: var(--bg-ui-hover); }
  .btn:active { background: var(--bg-active); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn--primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--on-accent);
    font-weight: 600;
  }
  .btn--primary:hover { background: var(--accent-strong); }
  .btn--primary:disabled, .btn:disabled { opacity: 0.45; cursor: default; }
  .btn--primary:disabled:hover, .btn:disabled:hover { background: var(--bg-ui); }
  .btn--primary:disabled:hover { background: var(--accent); }
  .btn--ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
  .btn--ghost:hover { background: var(--bg-ui); color: var(--text); border-color: transparent; }

  /* ---- workspace ---- */
  .workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ---- notebook ---- */
  .cells {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1rem 1.25rem 0.5rem;
  }
  .cell {
    margin-bottom: 1rem;
    animation: cell-in 150ms var(--ease);
  }
  @keyframes cell-in {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: none; }
  }
  .cell__source {
    display: flex;
    gap: 0.6rem;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
    background: var(--bg-ui);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.55rem 0.75rem;
  }
  .cell__source code { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .cell__source code { flex: 1; }
  .cell__rerun { flex: none; align-self: flex-start; padding: 0.15rem 0.35rem; font-size: 11px; }
  .cell__stale { color: var(--text-dim); font-family: var(--sans); font-size: 11px; margin-bottom: 0.25rem; }
  .cell__prompt { color: var(--accent-strong); flex: none; user-select: none; }
  .cell__output {
    margin: 0.35rem 0 0;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.55rem 0.75rem;
  }
  .cell__output .err { color: var(--error); }
  .widget { margin: 0.35rem 0; }
  .widget__canvas { display: block; max-width: 100%; image-rendering: pixelated; border-radius: var(--radius); }
  .widget__controls { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.3rem; }
  .widget__controls input[type="range"] { flex: 1; min-width: 0; }
  .tok-paren-0 { color: var(--paren0); }
  .tok-paren-1 { color: var(--paren1); }
  .tok-paren-2 { color: var(--paren2); }
  .tok-paren-3 { color: var(--paren3); }
  .tok-paren-4 { color: var(--paren4); }
  .tok-paren-5 { color: var(--paren5); }
  .tok-paren-0.match, .tok-paren-1.match, .tok-paren-2.match,
  .tok-paren-3.match, .tok-paren-4.match, .tok-paren-5.match,
  .tok-paren.match {
    background: color-mix(in srgb, var(--accent) 32%, transparent);
    border-radius: 3px;
  }
  .widget__wave { display: block; max-width: 100%; margin-top: 0.3rem; }
  .widget-src { font-size: 12px; color: var(--text-dim); }
  .widget-src code { white-space: pre-wrap; word-break: break-word; }
  .tok-cmt, .tok-paren { color: var(--text-dim); }
  .tok-num { color: var(--num); }
  .tok-str { color: var(--str); }
  .tok-kw { color: var(--kw); }
  .tok-typ { color: var(--typ); }
  .tok-lit { color: var(--str); }
  .tok-intr { color: var(--kw); }
  .tok-sym { color: var(--syn); }

  /* ---- welcome / empty state ---- */
  .welcome {
    max-width: 46rem;
    margin: 2rem auto 2.5rem;
    text-align: center;
    padding: 0 1rem;
  }
  .welcome__title { font-size: 18px; font-weight: 650; margin: 0 0 0.4rem; }
  .welcome__body { color: var(--text-dim); font-size: 13.5px; margin: 0 auto 1.25rem; max-width: 34rem; }
  .welcome__examples { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .example {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--syn);
    background: var(--bg-ui);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    transition: border-color 150ms var(--ease), color 150ms var(--ease), background-color 150ms var(--ease);
  }
  .example:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--bg-ui-hover); }
  .example:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- composer ---- */
  .composer {
    flex: none;
    padding: 0.75rem 1.25rem 0.9rem;
    background: var(--bg-subtle);
    border-top: 1px solid var(--border);
  }
  .editor {
    position: relative;
    background: var(--bg-ui);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    max-height: 9.3rem;
    overflow-y: auto;
    transition: border-color 150ms var(--ease);
  }
  .editor:focus-within { border-color: var(--accent); }
  .editor__mirror {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    margin: 0;
    padding: 0.6rem 0.75rem;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    pointer-events: none;
    color: var(--text);
    visibility: hidden;
  }
  .editor__mirror.is-visible { visibility: visible; }
  .editor__input {
    display: block;
    width: 100%;
    min-height: 2.6rem;
    overflow: hidden;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    padding: 0.6rem 0.75rem;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    z-index: 1;
  }
  .editor__input::placeholder { color: transparent; }
  .editor__input.is-plain { color: var(--text); }
  .editor__input.is-plain::placeholder { color: var(--text-dim); }

  .preview {
    min-height: 1.35rem;
    margin: 0.35rem 0.25rem 0;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .preview .err { color: var(--error); }
  .preview--empty { color: var(--text-dim); opacity: 0.6; }

  .composer__bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem 0.75rem;
    margin-top: 0.5rem;
  }
  .hint { color: var(--text-dim); font-size: 12px; margin: 0; }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--bg-ui);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0.05rem 0.35rem;
  }

  /* ---- completion popup ---- */
  .composer { position: relative; }
  .completion-popup {
    position: absolute;
    z-index: 20;
    display: flex;
    flex-direction: column;
    min-width: 8.5rem;
    max-height: 190px;
    overflow-y: auto;
    padding: 4px;
    background: var(--bg-ui);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.4;
  }
  .completion-popup button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .completion-popup button:hover { background: var(--bg-ui-hover); }
  .completion-popup button.selected {
    background: var(--accent);
    color: var(--on-accent);
  }

  /* ---- docs sidepanel ---- */
  .workspace { flex-direction: row; }
  .main-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .docs-panel {
    flex: none;
    width: 19rem;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--bg-raised);
  }
  body.docs-hidden .docs-panel { display: none; }
  .docs-panel__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0.6rem 0.75rem 0.4rem;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .docs-count { font-weight: 400; text-transform: none; }
  .docs-search {
    margin: 0 0.75rem 0.5rem;
    padding: 0.35rem 0.5rem;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: var(--bg-ui);
    border-radius: 6px;
  }
  .docs-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 0.75rem 0.75rem;
    font-size: 13px;
  }
  .docs-body details { margin-bottom: 0.25rem; }
  .docs-body summary {
    cursor: pointer;
    font-weight: 650;
    color: var(--text);
    padding: 0.2rem 0;
  }
  .docs-body summary .n { color: var(--text-dim); font-weight: 400; }
  .doc {
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
    padding: 0.1rem 0;
  }
  .doc button {
    flex: none;
    border: none;
    background: transparent;
    color: var(--accent-strong);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }
  .doc button:hover { text-decoration: underline; }
  .doc span { color: var(--text-dim); font-size: 12px; }
  @media (max-width: 900px) {
    .docs-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 30;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.35);
    }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header__left">
    <h1><span class="wordmark">skript</span> pad</h1>
    <span class="app-header__sub">typed lisp · register VM · in your browser</span>
  </div>
  <div class="app-header__right">
    <span id="status" class="status" role="status">loading…</span>
    <button id="clear" class="btn btn--ghost" type="button" title="Clear all cells">Clear</button>
    <button id="docs-toggle" class="btn btn--ghost" type="button" title="Toggle reference panel">Docs</button>
    <button id="theme" class="btn btn--ghost" type="button" title="Toggle light/dark theme">Light</button>
  </div>
</header>
<main class="workspace">
  <div class="main-col">
  <div id="cells" class="cells" aria-live="polite">
    <div id="welcome" class="welcome" hidden>
      <p class="welcome__title">Welcome to the skript pad</p>
      <p class="welcome__body">Type an expression — it evaluates live below as soon as the brackets balance. Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to commit it as a cell.</p>
      <div class="welcome__examples">
        <button class="example" type="button">(+ 1 2)</button>
        <button class="example" type="button">(fold [1 2 3 4] +)</button>
        <button class="example" type="button">(reshape (iota 12) [3 4])</button>
        <button class="example" type="button">(map [1 2 3] (fn (x) (* x x)))</button>
        <button class="example" type="button">(defn (fib n) (if (&lt; n 2) n (+ (fib (- n 1)) (fib (- n 2))))) (fib 15)</button>
      </div>
    </div>
  </div>
  <div class="composer">
    <div class="editor">
      <pre class="editor__mirror" id="mirror" aria-hidden="true"><code id="mirror-code"></code></pre>
      <textarea id="input" class="editor__input" rows="1" spellcheck="false" aria-label="skript code input" placeholder="(+ 1 2)"></textarea>
    </div>
    <div id="preview" class="preview" aria-live="polite"></div>
    <div class="composer__bar">
      <button id="run" class="btn btn--primary" type="button">Run</button>
      <p class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> run · plain <kbd>Enter</kbd> newline · <kbd>↑</kbd>/<kbd>↓</kbd> history</p>
    </div>
  </div>
  </div>
  <aside id="docs-panel" class="docs-panel" aria-label="function reference">
    <div class="docs-panel__head"><span>Reference</span><span id="docs-count" class="docs-count"></span></div>
    <input id="docs-search" class="docs-search" type="search" placeholder="filter reference&hellip;" aria-label="filter reference">
    <div id="docs-body" class="docs-body"></div>
  </aside>
</main>
<script>
"use strict";
/* ================= worker eval ================= */
// Long synchronous skriptPad evals run inside a Web Worker so they never
// block the page. The wasm side of this contract lives in web/worker.js.
var ASSET_REVISION = "__SKRIPT_ASSET_REVISION__";
var worker = null;
var workerReady = false;
var workerFailed = false;
var workerFailure = null;
var nextEvalId = 1;
var pendingEvalCount = 0;
var evalSinks = {}; // evalId -> { onOut: fn(text), onDone: fn(rc) }

function errorText(value) {
    if (value && value.message) return String(value.message);
    return String(value || "unknown worker error");
}
function reportCallbackFailure(value) {
    setStatus("err", "evaluation callback failed: " + errorText(value));
}

function finishEval(id, rc, message, skipOut) {
    var sink = evalSinks[id];
    if (!sink) return false;
    delete evalSinks[id];
    if (pendingEvalCount > 0) pendingEvalCount--;
    var text = message ? "error: " + message + "\n" :
        (rc !== 0 && !sink.sawOutput ? "error: evaluation failed\n" : null);
    var callbackError = skipOut ? message : null;
    if (text && !skipOut) {
        try { sink.onOut(text); } catch (e) { callbackError = e; }
    }
    try { sink.onDone(rc); } catch (e) { if (!callbackError) callbackError = e; }
    if (callbackError) reportCallbackFailure(callbackError);
    else if (pendingEvalCount === 0 && workerReady && !workerFailed) setStatus("ok", "ready");
    return true;
}

function failWorker(message) {
    var text = errorText(message);
    workerReady = false;
    workerFailed = true;
    workerFailure = text;
    if (worker) {
        try { worker.terminate(); } catch (e) {}
    }
    if (runBtn) runBtn.disabled = true;
    setStatus("err", text);
    var ids = Object.keys(evalSinks);
    for (var i = 0; i < ids.length; i++) finishEval(ids[i], 1, text);
}

function handleWorkerMessage(e) {
    var msg = e && e.data;
    if (!msg || typeof msg !== "object" || typeof msg.type !== "string") {
        failWorker("invalid worker message");
        return;
    }
    switch (msg.type) {
        case "ready":
            if (workerFailed || workerReady) {
                failWorker("duplicate worker startup message");
                return;
            }
            workerReady = true;
            if (runBtn) runBtn.disabled = false;
            setStatus("ok", "ready");
            try { bootAfterReady(); } catch (err) { failWorker("startup failed: " + errorText(err)); }
            break;
        case "out":
            if (typeof msg.id !== "number" || typeof msg.text !== "string") {
                failWorker("invalid worker output message");
                return;
            }
            if (evalSinks[msg.id]) {
                if (msg.text.length > 0) evalSinks[msg.id].sawOutput = true;
                try { evalSinks[msg.id].onOut(msg.text); } catch (err) {
                    finishEval(msg.id, 1, errorText(err), true);
                }
            }
            break;
        case "done":
            if (typeof msg.id !== "number" || typeof msg.rc !== "number") {
                failWorker("invalid worker completion message");
                return;
            }
            finishEval(msg.id, msg.rc, null);
            break;
        case "error":
            if (msg.id !== undefined && msg.id !== null) {
                if (typeof msg.id !== "number" || typeof msg.message !== "string") {
                    failWorker("invalid worker error message");
                    return;
                }
                finishEval(msg.id, 1, msg.message);
            } else {
                failWorker(msg.message || "worker startup failed");
            }
            break;
        case "title":
            if (typeof msg.text !== "string") {
                failWorker("invalid worker title message");
                return;
            }
            document.title = msg.text;
            break;
        default:
            failWorker("unknown worker message: " + msg.type);
    }
}

function startWorker() {
    try {
        worker = new Worker("worker.js?v=" + encodeURIComponent(ASSET_REVISION));
        worker.onmessage = handleWorkerMessage;
        worker.onerror = function (e) {
            failWorker(e && e.message ? e.message : "worker runtime failed");
        };
        worker.onmessageerror = function () {
            failWorker("worker message could not be decoded");
        };
    } catch (e) {
        failWorker(errorText(e));
    }
}

// Evaluate `src` in the worker. `onOut(text)` receives every streamed output
// chunk (write/display output and the final result line); `onDone(rc)` fires
// once with skriptPad's return code (0 ok / 1 error).
function runEval(src, onOut, onDone) {
    var id = nextEvalId++;
    var sink = { onOut: onOut, onDone: onDone, sawOutput: false };

    widgetPaintWave(wave, spec);
    var ac = null;
    var src = null;
    btn.addEventListener("click", function () {
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) { btn.disabled = true; return; }
            if (!ac) ac = new AC();
            if (ac.state === "suspended") ac.resume();
            if (src) {
                try { src.stop(); } catch (e) {}
                src = null;
                btn.textContent = "play";
                return;
            }
            var buf = ac.createBuffer(spec.nchan, spec.n, spec.rate);
            for (var c = 0; c < spec.nchan; c++) {
                var ch = buf.getChannelData(c);
                for (var i = 0; i < spec.n; i++) ch[i] = spec.data[c * spec.n + i];
            }
            var cur = ac.createBufferSource();
            cur.buffer = buf;
            cur.connect(ac.destination);
            cur.onended = function () {
                if (src === cur) { src = null; btn.textContent = "play"; }
            };
            src = cur;
            cur.start();
            btn.textContent = "stop";
        } catch (e) { btn.disabled = true; }

}
// Paint every widget placeholder under root. Called right after each
// innerHTML assignment that went through renderOutput.
function hydrateWidgets(root) {
    if (!root || !root.querySelectorAll) return;
    var nodes = root.querySelectorAll("div.widget[data-wid]");
    for (var k = 0; k < nodes.length; k++) {
        var box = nodes[k];
        var id = box.getAttribute("data-wid");
        var spec = widgetStore[id];
        if (!spec) continue;
        delete widgetStore[id];
        box.removeAttribute("data-wid");
        try {
            if (spec.kind === "image") widgetBuildImage(box, spec);
            else if (spec.kind === "video") widgetBuildVideo(box, spec);
            else widgetBuildAudio(box, spec);
        } catch (e) {
            box.textContent = "widget render failed";
        }
    }
}
function renderOutput(text) {
    // Style lines that carry a runtime error red (skriptPad streams "error: …").
    // Lines that parse as canonical widgets become live widgets; the raw
    // line is kept in a collapsed <details>. Malformed widget text stays
    // plain escaped text.
    var lines = text.split("\n");
    var html = "";
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var spec = parseWidgetLine(line.replace(/\s+$/, ""));
        if (spec) {
            var id = ++widgetSeq;
            widgetStore[id] = spec;
            html += '<div class="widget" data-wid="' + id + '"></div>' +
                '<details class="widget-src"><summary>source</summary><code>' +
                esc(line) + "</code></details>" +
                (i < lines.length - 1 ? "\n" : "");
        } else if (line.indexOf("error:") === 0) html += '<span class="err">' + esc(line) + "</span>\n";
        else html += esc(line) + (i < lines.length - 1 ? "\n" : "");
    }
    return html;
}
function addCell(src, out, meta) {
    meta = meta || {};
    var wrap = document.createElement("div");
    wrap.className = "cell";
    wrap.innerHTML =
        '<div class="cell__source"><span class="cell__prompt">&raquo;</span><code>' +
        highlight(src) + '</code><button class="cell__rerun btn btn--ghost" type="button">Run again</button></div>' +
        '<pre class="cell__output"></pre>';
    cellsEl.appendChild(wrap);
    var cell = {
        src: src,
        out: out || "",
        revision: typeof meta.revision === "string" ? meta.revision : null,
        stale: !!meta.stale,
        el: wrap,
    };
    cells.push(cell);
    currentCell = cell;
    wrap.querySelector(".cell__rerun").addEventListener("click", function () {
        rerunCell(cell);
    });
    renderCellOutput(cell);
    return cell;
}
function rerunCell(cell) {
    if (!cell || !workerReady) {
        setStatus("err", workerFailure || "worker is not ready");
        return;
    }
    var button = cell.el.querySelector(".cell__rerun");
    if (button) button.disabled = true;
    var nextOut = "";
    var wasStale = cell.stale;
    runEval(cell.src, function (text) { nextOut += text; }, function (rc) {
        if (button) button.disabled = false;
        if (rc === 0) {
            cell.out = nextOut;
            cell.revision = ASSET_REVISION;
            cell.stale = false;
        } else if (nextOut) {
            cell.out += nextOut;
            cell.stale = wasStale;
        }
        renderCellOutput(cell);
        persistCells();
    });
}
function hideWelcome() {    if (welcomeEl) welcomeEl.hidden = true;
}
function persistCells() {
    try {
        localStorage.setItem(STORE_KEY, JSON.stringify(cells.map(function (c) {
            return {
                src: c.src,
                out: c.out,
                revision: c.revision,
                stale: !!c.stale,
            };
        })));
    } catch (e) { /* quota / private mode: notebook is session-only */ }
}
function restoreCells() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
    if (!raw) return false;
    var list;
    try { list = JSON.parse(raw); } catch (e) { return false; }
    var notebookRevision = null;
    if (Array.isArray(list)) {
        // Legacy storage is a bare cell array.
    } else if (list && Array.isArray(list.cells)) {
        notebookRevision = typeof list.revision === "string" ? list.revision : null;
        list = list.cells;
    } else {
        return false;
    }
    list.forEach(function (saved) {
        if (!saved || typeof saved.src !== "string") return;
        var revision = typeof saved.revision === "string" ? saved.revision : notebookRevision;
        var stale = !!saved.stale || revision !== ASSET_REVISION;
        addCell(saved.src, typeof saved.out === "string" ? saved.out : "", {
            revision: revision,
            stale: stale,
        });
    });
    return cells.length > 0;
}
function clearCells() {
    stopWidgets(cellsEl);
    cells.forEach(function (c) { c.el.remove(); });
    cells = [];
    currentCell = null;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    welcomeEl.hidden = false;
    inputEl.focus();
}

/* ================= input mirror + preview ================= */

var previewTimer = null;
function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 300);
}
function renderMirror() {
    var src = inputEl.value;
    var hasContent = src.length > 0;
    var match = null;
    if (inputEl.selectionStart === inputEl.selectionEnd) {
        match = matchParenAt(src, inputEl.selectionStart);
    }
    mirrorCodeEl.innerHTML = highlight(src, match) + (hasContent && src[src.length - 1] === "\n" ? " " : "");
    mirrorEl.classList.toggle("is-visible", hasContent);
    inputEl.classList.toggle("is-plain", !hasContent);
}
function runPreview() {
    var src = inputEl.value;
    if (!src.trim()) {
        previewEl.textContent = "";
        previewEl.classList.remove("preview--empty");
        return;
    }
    if (!isBalanced(src)) {
        previewEl.textContent = "";
        return;
    }
    if (!workerReady) return;
    var out = "";
    runEval(src, function (t) { out += t; }, function (rc) {
        stopWidgets(previewEl);
        previewEl.innerHTML = renderOutput(out);
        hydrateWidgets(previewEl);
        if (rc !== 0) {
            // ensure an error is visible even if skriptPad printed nothing
            if (!/error:/.test(out)) previewEl.innerHTML = '<span class="err">error: ' + esc("eval failed") + "</span>";
        }
    });
}

/* ================= docs sidepanel ================= */
// Rendered from DOCS / DOC_GROUPS (generated from src/intrinsics.zig,
// src/prelude.pt, and the bind.zig special forms). Click a name to insert
// it at the caret; the search box filters all groups.
var docsPanel = document.getElementById("docs-panel");
var docsBody = document.getElementById("docs-body");
var docsSearch = document.getElementById("docs-search");
var docsCount = document.getElementById("docs-count");
var docsToggle = document.getElementById("docs-toggle");
var DOCS_KEY = "skript.pad.docs";
function docsInsert(name) {
    var caret = inputEl.selectionStart;
    var v = inputEl.value;
    var insert = name + " ";
    inputEl.value = v.slice(0, caret) + insert + v.slice(inputEl.selectionEnd);
    inputEl.setSelectionRange(caret + insert.length, caret + insert.length);
    afterEdit();
    inputEl.focus();
}
function renderDocs(filter) {
    var q = (filter || "").toLowerCase();
    docsBody.textContent = "";
    var shown = 0;
    DOC_GROUPS.forEach(function (group, gi) {
        var matches = group.names.filter(function (n) {
            return !q || n.toLowerCase().indexOf(q) !== -1 ||
                DOCS[n][1].toLowerCase().indexOf(q) !== -1;
        });
        if (matches.length === 0) return;
        shown += matches.length;
        var det = document.createElement("details");
        if (gi < 2 || q) det.open = true;
        var sum = document.createElement("summary");
        sum.textContent = group.title + " ";
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = "(" + matches.length + ")";
        sum.appendChild(n);
        det.appendChild(sum);
        matches.forEach(function (name) {
            var row = document.createElement("div");
            row.className = "doc";
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = name;
            b.title = "insert";
            b.addEventListener("click", function () { docsInsert(name); });
            var d = document.createElement("span");
            d.textContent = DOCS[name][1];
            row.appendChild(b);
            row.appendChild(d);
            det.appendChild(row);
        });
        docsBody.appendChild(det);
    });
    docsCount.textContent = shown + " shown";
}
var docsDebounce = null;
docsSearch.addEventListener("input", function () {
    clearTimeout(docsDebounce);
    docsDebounce = setTimeout(function () { renderDocs(docsSearch.value); }, 120);
});
docsToggle.addEventListener("click", function () {
    var hidden = document.body.classList.toggle("docs-hidden");
    try { localStorage.setItem(DOCS_KEY, hidden ? "hidden" : "shown"); } catch (e) {}
});
try {
    if (localStorage.getItem(DOCS_KEY) === "hidden") document.body.classList.add("docs-hidden");
} catch (e) {}
renderDocs("");

/* ================= boot ================= */
// Theme restore (before paint: the <html> tag already carries the default).
try {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
        themeBtn.textContent = savedTheme === "dark" ? "Light" : "Dark";
    }
} catch (e) {}

// Completion popup DOM + one-time listeners.
completionPopup = document.createElement("div");
completionPopup.className = "completion-popup";
completionPopup.style.display = "none";
completionPopup.addEventListener("mousedown", function (e) { e.preventDefault(); });
composerEl.appendChild(completionPopup);
editorEl.addEventListener("scroll", positionCompletionPopup);
inputEl.addEventListener("mouseup", function () { if (completionVisible) refreshCompletionAfterEdit(); });
inputEl.addEventListener("keyup", function () { renderMirror(); });
inputEl.addEventListener("click", function () { renderMirror(); });

// Runs once the worker reports its wasm ready (see worker.onmessage).
function bootAfterReady() {
    var restored = restoreCells();
    if (restored) hideWelcome();
    renderMirror();
    inputEl.focus();
    // First visit: run the hello demo so the pad proves itself.
    if (!restored) {
        inputEl.value = '(begin (write "hello from the skript pad\\n") (fold [1 2 3 4] +))';
        commit();
    }
}
</script>
